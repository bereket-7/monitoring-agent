# Copy to a sealed secret / external secret manager. Do not commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: monitoring-agent-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://monitoring:CHANGE_ME@postgres:5432/monitoring_agent
  REDIS_URL: redis://redis:6379/0
  API_KEYS: "replace-with-long-random-api-key"
  GRAFANA_URL: https://grafana.example.com
  GRAFANA_API_TOKEN: "read-only-grafana-token"
  PROMETHEUS_URL: https://prometheus.example.com
  LOKI_URL: https://loki.example.com
  OPENAI_API_KEY: "llm-provider-key"
  OTEL_EXPORTER_OTLP_ENDPOINT: https://otel-collector.example.com/v1/traces
